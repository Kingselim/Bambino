<div id="root" style="height: 650px; width: 100%;"></div>


<div class="recording-controls">
<div *ngIf="isRecording" class="text-danger">Recording in progress...</div>

  <button class="btn btn-primary" (click)="startRecording()" [disabled]="isRecording">
    Start Recording
  </button>
  <button class="btn btn-secondary" (click)="stopRecording()" [disabled]="!isRecording">
    Stop Recording
  </button>
</div>
