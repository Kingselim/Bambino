<div class="modal-content">
<h2>Edit Appointment</h2>
<form>
  <div class="form-group">
    <label>Location:</label>
    <input [(ngModel)]="appointment.location" name="location" class="form-control"/>
  </div>
  <div class="form-group">
    <label>Status:</label>
    <input [(ngModel)]="appointment.status" name="status" class="form-control"/>
  </div>
  <div class="form-group">
    <label>Description:</label>
    <input [(ngModel)]="appointment.description" name="description" class="form-control"/>
  </div>
  
  <!-- Appointment Date Picker -->
  <div class="form-group">
    <label>Appointment Date:</label>
    <mat-form-field appearance="outline">
      <mat-label>Choose a date</mat-label>
      <input matInput [matDatepicker]="picker" (dateChange)="onDateChange($event)" [value]="selectedDate">
      <mat-hint>YYYY-MM-DD</mat-hint>
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
  </div>
  
  <!-- Time Slot Selection -->
  <div class="form-group">
    <label>Time Slot:</label>
    <div class="time-slot-section">
      <h4>Morning Slots</h4>
      <div class="slot-list">
        <div *ngFor="let slot of morningSlots">
          <input 
  type="radio" 
  id="morning-{{slot}}" 
  name="appointmentSlot" 
  [value]="slot" 
  class="hidden-radio" 
  (change)="selectSlot(slot)" 
  [disabled]="isSlotBooked(slot)" />

          <label 
            for="morning-{{slot}}" 
            class="slot-button" 
            [ngClass]="{'slot-button-disabled': isSlotBooked(slot)}">
            {{ slot }}
          </label>
        </div>
      </div>
      
      <h4>Evening Slots</h4>
      <div class="slot-list">
        <div *ngFor="let slot of eveningSlots">
          <input 
  type="radio" 
  id="evening-{{slot}}" 
  name="appointmentSlot" 
  [value]="slot" 
  class="hidden-radio" 
  (change)="selectSlot(slot)" 
  [disabled]="isSlotBooked(slot)" />

          <label 
            for="evening-{{slot}}" 
            class="slot-button" 
            [ngClass]="{'slot-button-disabled': isSlotBooked(slot)}">
            {{ slot }}
          </label>
        </div>
      </div>
    </div>
  </div>
  
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
    <button type="button" class="btn btn-primary" (click)="save()">Save</button>
  </div>
</form>
</div>
