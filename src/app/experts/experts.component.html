<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<hr>
<div class="search-container">
    <input 
      type="text" 
      placeholder="Search Experts..." 
      [(ngModel)]="searchQuery" 
      (input)="onSearchChange()"
    />
    
    <select [(ngModel)]="selectedRole" (change)="onRoleChange()">
      <option value="">All Roles</option>
      <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
    </select>
    
    <button class="btn btn-primary" (click)="goToAppointments()">My Appointments</button>
    <button class="btn btn-secondary" (click)="goToMap()">search for nearest experts</button> 
  
</div>

  
  <div *ngIf="filteredExperts.length === 0">
    <p>No experts found.</p>
  </div>
  
  <div class="row">
    <div class="col-md-4" *ngFor="let expert of paginatedExperts">

      <div class="card mb-4">
        <!-- Using a placeholder image from an external source -->
        <img src="https://img.freepik.com/free-photo/bearded-doctor-glasses_23-2147896187.jpg" class="card-img-top" alt="Expert Image">
        <div class="card-body">
          <h5 class="card-title">{{ expert.name }}</h5>
          <p class="card-text">Specialty: {{ expert.specialty }}</p>
          <p class="card-text">Age: {{ expert.age }}</p>
          <a [routerLink]="['/expert-details', expert.id]" class="btn btn-primary">View Details</a>
          <button class="btn btn-warning ms-2" (click)="openRatingModal(expert, ratingModal)">Rate</button>
        </div>
      </div>
    </div>
  </div>
  <div class="pagination-container">
    <button *ngIf="currentPage > 1" (click)="changePage(currentPage - 1)" class="btn btn-secondary">
      Previous
    </button>
  
    <ng-container *ngFor="let page of totalPages">
      <button (click)="changePage(page)" 
              [class.active]="page === currentPage" 
              class="btn btn-light">
        {{ page }}
      </button>
    </ng-container>
  
    <button *ngIf="currentPage * expertsPerPage < filteredExperts.length" (click)="changePage(currentPage + 1)" class="btn btn-secondary">
      Next
    </button>
  </div>

  <hr>
  
  <!-- Rating Modal -->
<ng-template #ratingModal let-modal>
  <div class="modal-header">
    <h4 class="modal-title">Rate {{selectedExpert?.name}}</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss()"></button>
  </div>
  <div class="modal-body text-center">
    <div class="stars mb-3">
      <i *ngFor="let star of [1,2,3,4,5]" 
          class="bi fs-1 mx-1" 
          [class.bi-star-fill]="(hoverRating || selectedRating) >= star"
          [class.bi-star]="(hoverRating || selectedRating) < star"
          [style.color]="(hoverRating || selectedRating) >= star ? '#ffc107' : '#e4e5e9'"
          (click)="setRating(star)"
          (mouseenter)="setHoverRating(star)"
          (mouseleave)="resetHoverRating()">
      </i>
    </div>
    <p *ngIf="selectedRating > 0">You selected {{selectedRating}} star(s)</p>
    <p *ngIf="selectedRating === 0">Please select a rating</p>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="modal.dismiss()">Cancel</button>
    <button type="button" class="btn btn-primary" (click)="submitRating()" [disabled]="selectedRating === 0">Rate</button>
  </div>
</ng-template>
