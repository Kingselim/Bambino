<!-- Bouton pour ouvrir la modale -->
<button class="btn btn-primary" (click)="openModal()">➕ Ajouter un exercice</button>

<!-- La modale -->
<div class="modal" [ngClass]="{'show': showModal}" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <h2>Add New Exercice</h2>
    <form (ngSubmit)="save()">
      <div class="form-group">
        <label>Description</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="exercice.description"
          name="description"
          required
        />
      </div>
      <div class="form-group">
        <label>Difficulté</label>
        <select
          class="form-control"
          [(ngModel)]="exercice.difficulty"
          name="difficulty"
          required
        >
          <option value="Easy">Easy</option>
          <option value="Medium">Medium</option>
          <option value="Hard">Hard</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary mt-2">Save</button>
      <button type="button" class="btn btn-secondary" (click)="closeModal()">❌ Cancel</button>
    </form>
  </div>
</div>
