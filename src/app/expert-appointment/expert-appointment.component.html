<div class="expert-calendar-container">
    <div class="calendar-header">
        <h2 class="fw-bold">Expert Appointments</h2>
        <div class="date-pickers">
            <select [(ngModel)]="selectedMonth">
                <option *ngFor="let month of months" [value]="month">{{ month }}</option>
            </select>
            <select [(ngModel)]="selectedWeek">
                <option *ngFor="let week of weeks" [value]="week">{{ week }}</option>
            </select>
        </div>
    </div>

    <div class="calendar-grid">
        <!-- Days Row (X-Axis) -->
        <div class="day-label"></div>
        <div class="day-label" *ngFor="let day of daysOfWeek">
            {{ day }}
        </div>
    
        <!-- Hours and Appointment Slots (Y-Axis) -->
        <ng-container *ngFor="let hour of hours">
            <div class="hour-label">{{ hour }}</div>
            
            <!-- Appointment Slots -->
            <div class="appointment-slot" *ngFor="let day of daysOfWeek">
                <ng-container *ngIf="getAppointmentForSlot(day, hour) as app">
                    <div class="appointment-card" 
                         (mouseenter)="showDetails($event, app)" 
                         (mouseleave)="hideDetails()">
                        <div class="patient-name">{{ app.user.name }}</div>
                        <div class="appointment-time">{{ app.appointmentDateTime }}</div>
                        <div class="appointment-location">{{ app.location }}</div>
                    </div>
                </ng-container>
            </div>
        </ng-container>
    </div>
    

    <!-- Hover Modal -->
    <!-- <div class="appointment-modal" *ngIf="showModal" [ngStyle]="{top: modalPosition.y + 'px', left: modalPosition.x + 'px'}">
        <strong>{{ modalData.name }}</strong> <br>
        <span>Time: {{ modalData.time }}</span> <br>
        <span>Location: {{ modalData.location }}</span>
    </div> -->
</div>
<hr>
