<div class="container py-5">
    <h2 class="text-center fw-bold mb-4 text-pink">📝 To-Do List de Grossesse</h2>
  
    <div class="row">
      <!-- 📅 Colonne gauche : formulaire et calendrier -->
      <div class="col-md-4">
        <div class="card mb-4 shadow-sm">
          <div class="card-header bg-light-pink fw-bold">Ajouter une tâche</div>
          <div class="card-body">
            <div class="mb-3">
              <input type="text" class="form-control" placeholder="Nom de la tâche" [(ngModel)]="newTask.text">
            </div>
  
            <div class="mb-3">
              <select class="form-select" [(ngModel)]="newTask.status">
                <option value="todo">À faire</option>
                <option value="inProgress">En cours</option>
                <option value="done">Terminée</option>
              </select>
            </div>
  
            <div class="mb-3">
              <label>Date</label>
              <input type="date" class="form-control" [(ngModel)]="newTask.date">
            </div>
  
            <div class="mb-3">
              <label>Heure</label>
              <input type="time" class="form-control" [(ngModel)]="newTask.time">
            </div>
  
            <button class="btn btn-pink w-100" (click)="addTask()">Ajouter la tâche</button>
          </div>
        </div>
  
        <!-- 📆 Calendrier simplifié (liste des tâches par date) -->
        <div class="card shadow-sm">
          <div class="card-header bg-light fw-bold">📅 Tâches programmées</div>
          <ul class="list-group list-group-flush">
            <li *ngFor="let task of tasks" class="list-group-item small">
              {{ task.date }} - {{ task.text }} <span *ngIf="task.time">🕒 {{ task.time }}</span>
            </li>
          </ul>
        </div>
      </div>
  
      <!-- 📋 Colonnes Kanban : À faire / En cours / Terminée -->
      <div class="col-md-8">
        <div class="row g-3">
<!-- ✅ Bon -->
<div class="row text-center g-3">
    <div class="col-md-4" *ngFor="let status of statuses">
      <div class="card h-100 border-0 shadow-sm">
        <div class="card-header bg-light text-center fw-bold">
          {{ getTitle(status) }}
        </div>
        <ul class="list-group list-group-flush">
          <li *ngFor="let task of getTasksByStatus(status); let i = index"
              class="list-group-item d-flex justify-content-between align-items-start">
            <div>
              <div class="fw-bold">{{ task.text }}</div>
              <div class="text-muted small">
                {{ task.date }} <span *ngIf="task.time">• {{ task.time }}</span>
              </div>
            </div>
            <div class="d-flex flex-column align-items-end ms-3">
              <input type="checkbox" (change)="toggleStatus(i)" [checked]="task.status === 'done'">
              <button class="btn btn-sm btn-outline-danger mt-2" (click)="removeTask(i)">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </li>
          <li *ngIf="getTasksByStatus(status).length === 0"
              class="list-group-item text-muted text-center">
            Aucune tâche
          </li>
        </ul>
      </div>
    </div>
  </div>
  <div class="text-center mt-4">
    <button class="btn btn-outline-secondary rounded-pill" [routerLink]="['/monthly-tracking', idPregnancyTracking]">
      ← Retour au Suivi
    </button>
  </div>
  </div>
