<div class="container my-5 d-flex justify-content-center">
  <div class="card p-4 shadow-lg babysitting-card">
    <h2 class="text-center mb-4 text-primary">New Babysitting Contract</h2>

    <form (ngSubmit)="onSubmit()" #babysittingForm="ngForm">
      <!-- Duration -->
      <label>Duration (hours)</label>
      <input
        type="number"
        name="duration"
        [(ngModel)]="babysitting.duration"
        class="form-control rounded-pill px-4 mb-3"
        placeholder="e.g., 4"
        required
        min="1"
      />

      <!-- Salary -->
      <label>Salary (TND)</label>
      <input
        type="number"
        name="salary"
        [(ngModel)]="babysitting.salary"
        class="form-control rounded-pill px-4 mb-3"
        placeholder="e.g., 80"
        required
        min="10"
      />

      <!-- Status -->
      <label>Status</label>
      <select
        name="status"
        [(ngModel)]="babysitting.status"
        class="form-control rounded-pill px-4 mb-3"
        required
      >
      <option [ngValue]="null" disabled hidden>Select status</option>
        <option value="PENDING">Pending</option>
        <option value="CONFIRMED">Confirmed</option>
        <option value="CANCELLED">Cancelled</option>
      </select>

      <!-- Dates -->
      <label>Start Date</label>
      <input
        type="date"
        name="startDate"
        [(ngModel)]="startDateInput"
        class="form-control rounded-pill px-4 mb-3"
        required
      />

      <label>End Date</label>
      <input
        type="date"
        name="endDate"
        [(ngModel)]="endDateInput"
        class="form-control rounded-pill px-4 mb-4"
        required
      />

      <!-- Submit -->
      <button
        type="submit"
        class="btn btn-lg w-100 text-white py-3"
        [disabled]="babysittingForm.invalid"
        style="background-color: #ff4081; border-radius: 999px;"
      >
        {{ isEditMode ? 'Update Contract' : 'Create Contract' }}
      </button>
    </form>
