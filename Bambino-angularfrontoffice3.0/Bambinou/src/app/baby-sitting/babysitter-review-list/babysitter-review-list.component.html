<div *ngIf="reviews.length > 0; else noReviews">
  <!-- ✅ CONTENEUR CENTRÉ -->
  <div class="review-container mx-auto">
    <div *ngFor="let review of reviews" class="review-card mb-4 p-4 shadow-sm">
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <h6 class="text-primary fw-bold mb-2">
            <i class="fa fa-user-circle me-2"></i>{{ review.reviewerName || 'Anonymous' }}
          </h6>
          <p class="review-comment fst-italic">
            <i class="fa fa-quote-left me-2 text-muted"></i>{{ review.comment }}
          </p>
        </div>
        <div class="text-end">
          <div class="rating-stars mb-1">
            <span *ngFor="let star of [1,2,3,4,5]">
              <i class="fa"
                 [ngClass]="{
                   'fa-star text-warning': star <= review.rating,
                   'fa-star-o text-muted': star > review.rating
                 }"
                 style="font-size: 1.1rem;"></i>
            </span>
          </div>
          <small class="text-muted">({{ review.rating }}/5)</small>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #noReviews>
  <p class="text-muted text-center mt-4">😶 No reviews yet for this babysitter.</p>
</ng-template>
